<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <!-- 条带 S_a（浅蓝区域） -->
  <rect x="40" y="130" width="630" height="300" fill="#eaf3fb"/>
  <line x1="40" y1="130" x2="680" y2="130" stroke="#7fb3d5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="40" y1="430" x2="680" y2="430" stroke="#7fb3d5" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="684" y="126" font-size="13" fill="#2c6f9c">y = a</text>
  <text x="684" y="446" font-size="13" fill="#2c6f9c">y = −a</text>
  <text x="48" y="150" font-size="13" fill="#2c6f9c">条带 S_a = { z ∈ ℂ : |Im z| &lt; a }</text>

  <!-- 竖直边 x = ±(N+½)（虚线，随 N→∞ 消失） -->
  <line x1="150" y1="130" x2="150" y2="430" stroke="#e08a3c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="570" y1="130" x2="570" y2="430" stroke="#e08a3c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="150" y="464" font-size="13" fill="#b06a20" text-anchor="middle">x = −(N+½)</text>
  <text x="570" y="464" font-size="13" fill="#b06a20" text-anchor="middle">x = N+½</text>
  <text x="360" y="486" font-size="12" fill="#b06a20" text-anchor="middle">竖直边积分 → 0（N → ∞，Claim 3）</text>

  <!-- 坐标轴 -->
  <line x1="36" y1="280" x2="694" y2="280" stroke="#555" stroke-width="1.2"/>
  <polygon points="694,280 682,274 682,286" fill="#555"/>
  <text x="694" y="270" font-size="13" fill="#555">Re z</text>
  <text x="44" y="268" font-size="13" fill="#555">Im z</text>

  <!-- 水平边 L1（下，自左至右）、L2（上，自右至左） -->
  <line x1="60" y1="370" x2="660" y2="370" stroke="#1f6fb2" stroke-width="2.4"/>
  <polygon points="660,370 648,364 648,376" fill="#1f6fb2"/>
  <text x="566" y="392" font-size="13" fill="#1f6fb2">L₁ : Im z = −b</text>

  <line x1="660" y1="190" x2="60" y2="190" stroke="#1f6fb2" stroke-width="2.4"/>
  <polygon points="60,190 72,184 72,196" fill="#1f6fb2"/>
  <text x="64" y="176" font-size="13" fill="#1f6fb2">L₂ : Im z = +b</text>

  <!-- 矩形围道 γ_N（逆时针） -->
  <path d="M 150 370 L 570 370 L 570 190 L 150 190 Z" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <polygon points="570,370 559,362 561,377" fill="#c0392b"/>
  <polygon points="570,190 561,201 575,199" fill="#c0392b"/>
  <polygon points="150,190 161,198 159,183" fill="#c0392b"/>
  <polygon points="150,370 159,359 145,361" fill="#c0392b"/>
  <text x="540" y="168" font-size="14" fill="#c0392b" font-weight="bold">γ_N</text>

  <!-- b 与 a 的高度标记 -->
  <line x1="76" y1="280" x2="76" y2="370" stroke="#666" stroke-width="1.2"/>
  <polygon points="76,280 72,292 80,292" fill="#666"/>
  <polygon points="76,370 72,358 80,358" fill="#666"/>
  <text x="56" y="330" font-size="13" fill="#666">b</text>

  <line x1="98" y1="280" x2="98" y2="130" stroke="#666" stroke-width="1.2"/>
  <polygon points="98,280 94,292 102,292" fill="#666"/>
  <polygon points="98,130 94,142 102,142" fill="#666"/>
  <text x="78" y="205" font-size="13" fill="#666">a</text>

  <!-- 整数极点 ×（核 1/(e^{2πiz}−1) 的简单极点） -->
  <g stroke="#444" stroke-width="1.6">
    <line x1="175" y1="274" x2="185" y2="286"/>
    <line x1="175" y1="286" x2="185" y2="274"/>
    <line x1="235" y1="274" x2="245" y2="286"/>
    <line x1="235" y1="286" x2="245" y2="274"/>
    <line x1="295" y1="274" x2="305" y2="286"/>
    <line x1="295" y1="286" x2="305" y2="274"/>
    <line x1="355" y1="274" x2="365" y2="286"/>
    <line x1="355" y1="286" x2="365" y2="274"/>
    <line x1="415" y1="274" x2="425" y2="286"/>
    <line x1="415" y1="286" x2="425" y2="274"/>
    <line x1="475" y1="274" x2="485" y2="286"/>
    <line x1="475" y1="286" x2="485" y2="274"/>
    <line x1="535" y1="274" x2="545" y2="286"/>
    <line x1="535" y1="286" x2="545" y2="274"/>
  </g>
  <text x="180" y="302" font-size="12" fill="#444" text-anchor="middle">n = −N</text>
  <text x="540" y="302" font-size="12" fill="#444" text-anchor="middle">n = N</text>
  <text x="360" y="302" font-size="12" fill="#444" text-anchor="middle">0</text>
  <text x="360" y="520" font-size="12" fill="#444" text-anchor="middle">×：核 1/(e^{2πiz}−1) 在整数点的简单极点（n ∈ ℤ，Claim 1）</text>
</svg>
